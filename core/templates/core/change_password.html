{% extends 'core/base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Change Password</h1>
  <p class="subtitle">Update your account password</p>
</div>
<div style="max-width:440px;">
  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Current Password</label>
        <input class="form-input" type="password" name="old_password" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input class="form-input" type="password" name="new_password" required minlength="6">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input class="form-input" type="password" name="confirm_password" required minlength="6">
      </div>
      <div style="display:flex;gap:12px;margin-top:8px;">
        <button type="submit" class="btn btn-primary">Update Password</button>
        <a href="{% url 'settings' %}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
