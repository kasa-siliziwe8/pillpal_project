<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register — Pill Pal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#1A6B6B;--teal-light:#2A9090;--teal-pale:#E0F2F2;--terracotta:#C0572B;--ochre:#D4952A;--cream:#FAF7F2;--ink:#1A1A2E;--ink-60:#1A1A2E99;--ink-10:#1A1A2E1A;--red:#C0392B;--red-light:#FDECEA;--radius:16px;--radius-sm:10px;--radius-pill:100px;--shadow-lg:0 8px 48px rgba(26,26,46,.14)}
body{font-family:'DM Sans',sans-serif;background:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-wrap{max-width:560px;width:100%;background:white;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg);padding:48px}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.logo-pill{width:32px;height:18px;background:linear-gradient(135deg,var(--terracotta) 50%,var(--ochre) 50%);border-radius:100px}
.auth-logo span{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:700;color:var(--teal)}
h1{font-family:'Fraunces',serif;font-size:1.8rem;font-weight:700;color:var(--ink);margin-bottom:4px}
.sub{color:var(--ink-60);font-size:.9rem;margin-bottom:28px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:16px}
.form-label{font-size:.78rem;font-weight:600;color:var(--ink-60);letter-spacing:.04em;display:block;margin-bottom:4px}
.form-input,.form-select{width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--ink-10);font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none;color:var(--ink);transition:border-color .2s;background:white}
.form-input:focus,.form-select:focus{border-color:var(--teal)}
.btn-submit{width:100%;padding:14px;border-radius:var(--radius-pill);background:var(--teal);color:white;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:700;border:none;cursor:pointer;transition:all .2s;margin-top:4px}
.btn-submit:hover{background:var(--teal-light);transform:translateY(-1px)}
.auth-footer{text-align:center;margin-top:18px;font-size:.85rem;color:var(--ink-60)}
.auth-footer a{color:var(--teal);font-weight:600;text-decoration:none}
.error-msg{background:var(--red-light);border:1px solid var(--red);border-radius:var(--radius-sm);padding:10px 14px;color:var(--red);font-size:.85rem;margin-bottom:16px}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-logo"><div class="logo-pill"></div><span>Pill Pal</span></div>
  <h1>Create account</h1>
  <p class="sub">Join Pill Pal to manage your medication adherence</p>
  {% if messages %}{% for message in messages %}<div class="error-msg">{{ message }}</div>{% endfor %}{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">First Name</label>
        <input class="form-input" type="text" name="first_name" placeholder="Thabo" required>
      </div>
      <div class="form-group">
        <label class="form-label">Last Name</label>
        <input class="form-input" type="text" name="last_name" placeholder="Dlamini" required>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="form-input" type="text" name="username" placeholder="Choose a username" required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" name="password" placeholder="Choose a password" required>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input class="form-input" type="tel" name="phone_number" placeholder="+27 72 000 0000">
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select class="form-select" name="role">
          <option value="patient">Patient</option>
          <option value="caregiver">Caregiver</option>
          <option value="clinic_admin">Clinic Admin</option>
        </select>
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Reminder Channel</label>
        <select class="form-select" name="channel_preference">
          <option value="sms">SMS</option>
          <option value="voice">Voice Call</option>
          <option value="app">App Notification</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Clinic</label>
        <select class="form-select" name="clinic">
          <option value="">— Select clinic —</option>
          {% for clinic in clinics %}<option value="{{ clinic.pk }}">{{ clinic.name }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <button class="btn-submit" type="submit">Create Account →</button>
  </form>
  <div class="auth-footer">Already have an account? <a href="{% url 'login' %}">Sign in</a></div>
</div>
</body>
</html>
